<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Course Assistant RAG</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f8; margin: 0; padding: 20px; }
        .chat-card { max-width: 750px; margin: 0 auto; background: #fff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); padding: 24px; }
        h2 { margin-top: 0; color: #1a202c; }
        .messages { min-height: 250px; max-height: 450px; overflow-y: auto; border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px; margin-bottom: 20px; background: #fafafa; }
        .msg { margin-bottom: 15px; padding: 10px 14px; border-radius: 8px; line-height: 1.5; }
        .user { background: #0070f3; color: white; margin-left: 20%; border-radius: 12px 12px 0 12px; }
        .bot { background: #edf2f7; color: #2d3748; margin-right: 20%; border-radius: 12px 12px 12px 0; }
        .sources { font-size: 0.82em; color: #4a5568; margin-top: 8px; border-top: 1px dashed #cbd5e0; padding-top: 6px; }
        .input-row { display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 12px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 1rem; }
        button { padding: 12px 24px; background: #0070f3; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:disabled { background: #a0aec0; }
    </style>
</head>
<body>

<div class="chat-card">
    <h2>📚 Course QA Assistant</h2>
    <div id="chat" class="messages">
        <div class="msg bot">Hello! Ask me any question about your RAG course notes.</div>
    </div>
    <div class="input-row">
        <input type="text" id="query" placeholder="e.g. What is precision?" onkeydown="if(event.key==='Enter') sendQuery()">
        <button id="sendBtn" onclick="sendQuery()">Ask</button>
    </div>
</div>

<script>
async function sendQuery() {
    const input = document.getElementById('query');
    const chat = document.getElementById('chat');
    const btn = document.getElementById('sendBtn');
    const text = input.value.trim();
    if (!text) return;

    // Display user question
    chat.innerHTML += `<div class="msg user">${text}</div>`;
    input.value = '';
    btn.disabled = true;
    chat.scrollTop = chat.scrollHeight;

    try {
        const response = await fetch('/api/ask', {
            method: 'POST',
            headers: { 'Content-Type': 'json' },
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question: text, top_k: 3 })
        });
        const data = await response.json();

        let sourcesHTML = '<div class="sources"><b>Retrieved Context Sources:</b><br>';
        data.sources.forEach((s, idx) => {
            sourcesHTML += `• <i>${s.source}</i> (Score: ${s.score.toFixed(3)})<br>`;
        });
        sourcesHTML += '</div>';

        chat.innerHTML += `<div class="msg bot">${data.answer}${sourcesHTML}</div>`;
    } catch (err) {
        chat.innerHTML += `<div class="msg bot" style="color:red">Failed to get response from server.</div>`;
    } finally {
        btn.disabled = false;
        chat.scrollTop = chat.scrollHeight;
    }
}
</script>
</body>
</html>
